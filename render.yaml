# Render.com 自动部署配置 (免费计划)
# 将项目上传GitHub后，在Render连接仓库即可自动部署
# 部署后的网址: https://fund-scorer.onrender.com

services:
  - type: web
    name: fund-scorer
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port ${PORT:-8000}
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
